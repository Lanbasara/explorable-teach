<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/course.css">
<style>
  .dossier-thesis { margin: 0 0 52px; }

  .unit-list { list-style: none; padding: 0; margin: 0; }
  .unit {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 4px 14px;
    align-items: baseline;
    padding: 15px 14px;
    margin: 0 -14px;
    border-radius: var(--radius);
    border-bottom: 1px solid var(--border);
  }
  .unit:last-child { border-bottom: none; }
  .unit.live { background: var(--bg-soft); }
  .unit.pending { opacity: .5; }

  .unit-status { font-size: 15px; line-height: 1.6; }
  .unit-num {
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
    color: var(--accent); text-transform: uppercase;
  }
  .unit-title { font-size: 16px; font-weight: 600; color: var(--fg); margin: 2px 0 3px; }
  .unit-claim { font-size: 13.5px; color: var(--fg-dim); line-height: 1.65; }
  .unit-note  { font-size: 12.5px; color: var(--accent-warm); margin-top: 5px; }
  .unit-body  { grid-column: 2; }

  .unit-links { grid-column: 3; grid-row: 1 / span 2; display: flex; gap: 6px; align-items: center; }
  .unit-links a, .unit-links span {
    font-size: 12.5px; text-decoration: none; white-space: nowrap;
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
  }
  .unit-links a { color: var(--fg-dim); background: var(--bg-card); }
  .unit-links a:hover { color: var(--fg); border-color: var(--border-hi); }
  .unit-links a.primary { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .unit-links span { color: var(--fg-faint); opacity: .4; border-style: dashed; }

  .doc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .doc-card {
    display: block; text-decoration: none; padding: 14px 16px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  }
  .doc-card:hover { border-color: var(--border-hi); }
  .doc-card b { color: var(--accent); font-size: 14px; font-weight: 600; }
  .doc-card em { display: block; font-style: normal; color: var(--fg-dim); font-size: 12.5px; margin-top: 4px; line-height: 1.6; }

  .tutor-status {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 13px 16px; border-radius: var(--radius);
    background: var(--bg-card); border: 1px solid var(--border);
    font-size: 13.5px; color: var(--fg-dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-faint); flex: none; }
  .dot.up { background: var(--accent-good); }
  .dot.down { background: var(--fg-faint); }
  /* Hollow: this page cannot see the service from here, so it marks the absence
     of an answer rather than an answer. */
  .dot.unknown { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fg-faint); }
  .tutor-status code {
    background: var(--bg); padding: 2px 8px; border-radius: 5px;
    font-family: var(--mono); font-size: 12.5px; color: var(--accent-warm);
  }

  @media (max-width: 620px) {
    .unit { grid-template-columns: 26px 1fr; }
    .unit-links { grid-column: 2; grid-row: auto; flex-wrap: wrap; margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="lesson">

<header class="lesson-header">
  <div class="lesson-num">Dossier</div>
  <h1 id="course-title"></h1>
  <p class="lesson-sub" id="course-sub"></p>
</header>

<div class="callout thesis dossier-thesis" id="thesis-box" hidden>
  <span class="callout-label" id="thesis-label"></span>
  <p id="thesis-body"></p>
</div>

<h2>Units</h2>
<ul class="unit-list" id="units"></ul>

<h2>Course documents</h2>
<div class="doc-grid" id="docs"></div>

<div id="refs-section" hidden>
  <h2>Reference sheets</h2>
  <div class="doc-grid" id="refs"></div>
</div>

<h2>Tutor</h2>
<div class="tutor-status">
  <span class="dot" id="tdot"></span>
  <span id="tmsg">Checking…</span>
</div>

<footer class="lesson-footer">
  <p>Status: ✅ done and verified · 🚧 taught, awaiting verification · ⬜ not started.
  <code>CURRICULUM.md</code> is the authority on progress; the two should agree.</p>
</footer>

</div>

<script src="assets/units.js"></script>
<script>
/* The cover of this workspace: the one page every unit is reachable from.
 *
 * The scaffold copies this in once and never touches it again, so from that
 * moment it is the workspace's rather than the plugin's. Everything written
 * out here is seeded in English — the headings above, the status legend, the
 * link labels below — and none of it is looked up anywhere, so rewrite it in
 * the learner's language. The title, the subtitle and the units themselves
 * come from assets/units.js, which is where this course describes itself.
 */
(function () {
  'use strict';
  var ICON = { done: '✅', teaching: '🚧', todo: '⬜' };
  var CLS  = { done: 'live', teaching: 'live', todo: 'pending' };

  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x) n.textContent = x; return n; }

  /* ---- course identity (authored HTML from units.js, not user input) ---- */
  var course = window.TEACH_COURSE || {};

  /* The learner's language, stated once in units.js. Lesson pages get this from
     assets/lesson-boot.js; the cover loads the manifest itself, so it does the
     same thing here. A page that declared its own is left alone. */
  if (!document.documentElement.getAttribute('lang') && course.lang) {
    document.documentElement.setAttribute('lang', course.lang);
  }

  document.title = course.title ? course.title + ' · Dossier' : 'Dossier';
  document.getElementById('course-title').textContent = course.title || 'Dossier';
  /* Authored HTML, spliced only when this course has written some — an empty
     assignment is a splice too, and there is nothing for it to do. It also
     means a course with no subtitle never splices at all, which is what lets
     the suite mount this page: its DOM refuses markup on purpose, so the only
     line here it cannot run is this one. */
  if (course.subtitle) document.getElementById('course-sub').innerHTML = course.subtitle;
  if (course.thesis) {
    document.getElementById('thesis-box').hidden = false;
    document.getElementById('thesis-label').textContent = course.thesisLabel || 'Thesis';
    document.getElementById('thesis-body').innerHTML = course.thesis;
  }

  /* ---- units ---- */
  var list = document.getElementById('units');
  (window.TEACH_UNITS || []).forEach(function (u) {
    var li = el('li', 'unit ' + (CLS[u.status] || 'pending'));
    li.appendChild(el('div', 'unit-status', ICON[u.status] || '⬜'));

    var body = el('div', 'unit-body');
    body.appendChild(el('div', 'unit-num', u.num));
    body.appendChild(el('div', 'unit-title', u.title));
    body.appendChild(el('div', 'unit-claim', u.claim || ''));
    if (u.assignmentNote) {
      body.appendChild(el('div', 'unit-note', 'Assignment: ' + u.assignmentNote));
    }
    li.appendChild(body);

    var links = el('div', 'unit-links');
    [['lesson', 'Lesson', true], ['checkpoint', 'Checkpoint', false],
     ['assignment', 'Assignment', false]]
      .forEach(function (p) {
        if (u[p[0]]) {
          var a = el('a', p[2] ? 'primary' : '', p[1]);
          a.href = u[p[0]];
          links.appendChild(a);
        } else if (u.status !== 'todo') {
          links.appendChild(el('span', '', p[1]));
        }
      });
    li.appendChild(links);
    list.appendChild(li);
  });

  /* ---- docs + reference sheets ---- */
  function cards(target, items) {
    items.forEach(function (d) {
      var a = el('a', 'doc-card');
      a.href = d.path;
      a.appendChild(el('b', '', d.label));
      a.appendChild(el('em', '', d.note || ''));
      target.appendChild(a);
    });
  }
  cards(document.getElementById('docs'), window.TEACH_DOCS || []);
  var refs = window.TEACH_REFS || [];
  if (refs.length) {
    document.getElementById('refs-section').hidden = false;
    cards(document.getElementById('refs'), refs);
  }

  /* ---- tutor health ----
   *
   * Three states, and the third one is not a fact about the service at all.
   * The tutor is reachable only from a page the service itself served: a
   * request from a page opened off the disk names another origin, and the
   * browser refuses to make it. Asking anyway and reading that refusal as "not
   * running" is how this page came to tell a learner to start a service that
   * was already up. So it asks only when it is being served, and what it asks
   * for is a relative address — the one form that is right whatever port the
   * service was bound to.
   *
   * The three sentences are this workspace's own, seeded in English like every
   * other line written out on this page, and not looked up anywhere. Rewrite
   * them in the learner's language along with the headings above.
   */
  var dot = document.getElementById('tdot'), msg = document.getElementById('tmsg');
  var served = location.protocol === 'http:' || location.protocol === 'https:';

  function state(cls, parts) {
    dot.className = 'dot ' + cls;
    msg.textContent = '';
    parts.forEach(function (part) {
      msg.appendChild(typeof part === 'string' ? document.createTextNode(part) : part);
    });
  }

  if (!served) {
    state('unknown', ['This page was opened from disk, so it cannot reach the tutor service —'
      + ' and cannot tell whether it is running. Open the course through the tutor service'
      + ' to ask questions inside a lesson.']);
  } else {
    fetch('/api/health', { method: 'GET' })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (d) {
        state('up', ['Online · up for ' + Math.round((d.uptimeSec || 0) / 60) + ' min'
          + ' (exits after ' + Math.round((d.idleTimeoutSec || 0) / 3600) + ' h idle)']);
      })
      .catch(function () {
        state('down', [
          'Not running. Run ',
          el('code', '', './tutor/tutorctl.sh start'),
          ' in the workspace directory to ask questions inside the page.'
            + ' The course does not depend on it.'
        ]);
      });
  }
})();
</script>
</body>
</html>
